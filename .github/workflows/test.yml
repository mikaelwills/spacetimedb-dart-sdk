name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # Pin SpacetimeDB CLI version deliberately. Upgrade is a conscious act.
  # Verified against local `spacetime --version` on 2026-04-05.
  SPACETIMEDB_VERSION: '2.0.5'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: dart analyze --fatal-infos

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: dart test test/unit/

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable + wasm32 target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo build for test module
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spacetime_test_module

      - name: Cache SpacetimeDB CLI binaries
        id: cache-spacetime
        uses: actions/cache@v4
        with:
          path: ~/.local/bin
          key: spacetimedb-${{ runner.os }}-${{ env.SPACETIMEDB_VERSION }}

      - name: Install SpacetimeDB CLI (direct tarball for true version pin)
        if: steps.cache-spacetime.outputs.cache-hit != 'true'
        # The upstream install script (`install.spacetimedb.com`) always
        # resolves to the latest release regardless of SPACETIME_DOWNLOAD_ROOT,
        # so we bypass it and download the versioned tarball directly from the
        # GitHub release asset. Tarball contains two binaries at root:
        # `spacetimedb-cli` (the `spacetime` command) and `spacetimedb-standalone`.
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          url="https://github.com/clockworklabs/SpacetimeDB/releases/download/v${SPACETIMEDB_VERSION}/spacetime-x86_64-unknown-linux-gnu.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL "$url" | tar -xz -C "$HOME/.local/bin"
          # The `spacetime` command is `spacetimedb-cli`; create a symlink so
          # the test harness's `spacetime ...` invocations resolve.
          ln -sf "$HOME/.local/bin/spacetimedb-cli" "$HOME/.local/bin/spacetime"
          chmod +x "$HOME/.local/bin/spacetimedb-cli" "$HOME/.local/bin/spacetimedb-standalone"

      - name: Add SpacetimeDB to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify SpacetimeDB install (diagnostic)
        run: |
          ls -la "$HOME/.local/bin/"
          spacetime --version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Run integration tests
        run: dart test test/integration/
