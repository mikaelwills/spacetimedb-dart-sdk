name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  # SpacetimeDB CLI version we expect the install script to produce. The
  # upstream install script always resolves to latest, so this is a label
  # that the "Assert CLI version" step enforces as a dead-man switch: if
  # upstream ships a new release and CI gets a cache miss, the version
  # assertion fails loudly and we upgrade this env var deliberately (and
  # verify nothing broke) rather than silently tracking latest. Update this
  # in lockstep when `spacetime version upgrade` happens locally.
  SPACETIMEDB_VERSION: '2.8.2'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: dart analyze --fatal-infos

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test test/unit/

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (pinned) + wasm32 target
        run: |
          rustup toolchain install 1.94.0 --profile minimal
          rustup default 1.94.0
          rustup target add wasm32-unknown-unknown

      - name: Cache cargo build for test module
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: spacetime_test_module

      - name: Cache SpacetimeDB CLI install
        id: cache-spacetime
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/bin/spacetime
            ~/.local/share/spacetime
          key: spacetimedb-${{ runner.os }}-${{ env.SPACETIMEDB_VERSION }}

      - name: Install SpacetimeDB CLI
        if: steps.cache-spacetime.outputs.cache-hit != 'true'
        # The install script sets up the CLI's version-dispatch layout but
        # always lands on whatever is currently `latest`, so pin the active
        # version explicitly afterwards. Without that second step CI breaks
        # every time upstream publishes a release, regardless of our code.
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://install.spacetimedb.com | sh -s -- -y
          export PATH="$HOME/.local/bin:$PATH"
          spacetime version install "$SPACETIMEDB_VERSION"
          spacetime version use "$SPACETIMEDB_VERSION"

      - name: Add SpacetimeDB to PATH
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Assert CLI version matches pin (dead-man switch)
        # Now that the install step pins explicitly, a failure here means the
        # pin did not take (a cache holding a different active version, or an
        # upstream layout change) — not merely that upstream moved on.
        run: |
          set -euo pipefail
          installed="$(spacetime --version | grep -oE 'tool version [0-9]+\.[0-9]+\.[0-9]+' | awk '{print $3}')"
          echo "Installed: $installed"
          echo "Expected:  $SPACETIMEDB_VERSION"
          if [ "$installed" != "$SPACETIMEDB_VERSION" ]; then
            echo "ERROR: pinned SpacetimeDB version is not the active one." >&2
            echo "Check that 'spacetime version use' ran, and that the restored" >&2
            echo "cache key matches SPACETIMEDB_VERSION." >&2
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Run integration tests
        run: flutter test test/integration/
