# Dart test configuration
# Runs setup before all tests to ensure SpacetimeDB is ready

# Global timeout for all tests
timeout: 30s

# Run test files sequentially. Integration tests spin up a shared SpacetimeDB
# server in setUpAll and tear it down in tearDownAll, so parallel file
# execution would have one file killing the server out from under another
# file that is still running against it. Keep this at 1 unless you've made
# the per-file setup parallel-safe.
concurrency: 1

# Paths
paths:
  - test/

# Tags for organizing tests
tags:
  integration:
    # Integration tests need more time
    timeout: 60s
  unit:
    # Unit tests are fast
    timeout: 10s

# Platforms
platforms:
  - vm

# Test randomization
test_randomize_ordering_seed: random
