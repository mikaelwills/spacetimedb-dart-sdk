name: spacetimedb_sdk
description: "Dart SDK for SpacetimeDB. SubscribeMulti, real-time typed tables, reactive primitives, optimistic updates, and opt-in offline storage for Flutter apps."
version: 1.1.1
homepage: https://github.com/mikaelwills/spacetimedb-dart-sdk
repository: https://github.com/mikaelwills/spacetimedb-dart-sdk
issue_tracker: https://github.com/mikaelwills/spacetimedb-dart-sdk/issues

topics:
  - spacetimedb
  - realtime
  - websocket
  - sync
  - flutter

environment:
  sdk: ^3.7.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  web_socket_channel: ^3.0.3
  brotli: ^0.6.0
  web: ^1.1.0
  http: ^1.2.0
  fixnum: ^1.1.0
  uuid: ^4.5.1
  meta: ^1.11.0

  code_builder: ^4.11.0
  args: ^2.7.0
  path: ^1.9.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.26.2
executables:
  generate:

